<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ffmpegUI — local video converter</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#e8eaf2;background:#0d1018;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -25%,#292a50 0,transparent 55%),#0d1018}.wrap{width:min(640px,calc(100% - 36px));margin:0 auto;padding:52px 0}header{display:flex;align-items:center;gap:11px;font-weight:750;font-size:19px;letter-spacing:-.04em}.mark{display:grid;place-items:center;width:34px;height:34px;background:#a998ff;border-radius:10px;color:#18132e;font-weight:900}.badge{margin-left:auto;color:#aab0bf;font-size:12px;letter-spacing:0;font-weight:500;display:flex;gap:7px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#7fe2af}main{padding-top:62px}h1{font-size:clamp(32px,6vw,44px);letter-spacing:-.055em;line-height:1.1;margin:0 0 14px} .intro{color:#a6adbd;line-height:1.6;margin:0 0 30px}.card{background:#171b26;border:1px solid #303546;border-radius:18px;padding:24px;box-shadow:0 18px 60px #0003}.drop{border:1.5px dashed #62677d;background:#1b1f2c;border-radius:12px;min-height:208px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer;transition:.15s}.drop:hover,.drop.drag{border-color:#b5a4ff;background:#25233a}.icon{width:48px;height:48px;background:#312c4a;color:#c0b3ff;border-radius:14px;display:grid;place-items:center;margin-bottom:16px}.drop strong{font-size:16px;overflow-wrap:anywhere}.drop p{color:#969eaf;font-size:13px;margin:8px 0 0}.browse{color:#c1b5ff}.field{margin-top:23px}label{display:block;font-size:13px;font-weight:650;margin-bottom:9px}select{width:100%;padding:13px 14px;background:#10141e;border:1px solid #383e50;border-radius:9px;color:#f4f3ff;font:inherit}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:9px;background:#b4a2ff;color:#1b1630;font:inherit;font-weight:750;cursor:pointer}button:hover:not(:disabled){background:#c9bcff}button:disabled{opacity:.45;cursor:not-allowed}.status{min-height:21px;color:#aab2c3;font-size:13px;line-height:1.5;margin:15px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.status.error{color:#ff9f9f}footer{text-align:center;margin-top:27px;font-size:12px;color:#838b9c;line-height:1.6}.spin{display:inline-block;width:12px;height:12px;border:2px solid #82769f;border-top-color:#ddd1ff;border-radius:50%;animation:spin .8s linear infinite;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap"><header><span class="mark">✦</span>ffmpegUI<span class="badge"><span class="dot"></span> Runs locally</span></header><main><h1>Convert without the fuss.</h1><p class="intro">Drop in a video, choose your format, and let FFmpeg do the rest. Your files stay on your computer.</p><div class="card"><div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose or drop a video file"><div class="icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 16V4m-4 4 4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></div><strong id="filename">Drag & drop your video here</strong><p id="hint">or <span class="browse">browse files</span> to get started</p></div><input id="file" type="file" accept="video/*,audio/*,.mov,.mkv,.avi,.webm,.mp4" hidden><div class="field"><label for="format">Convert to</label><select id="format"><option value="mp4">MP4 · widely compatible</option><option value="mov">MOV · QuickTime video</option><option value="mkv">MKV · Matroska video</option><option value="webm">WebM · web video</option><option value="mp3">MP3 · audio only</option><option value="wav">WAV · audio only</option></select></div><button id="convert" disabled>Convert video</button><p class="status" id="status" role="status" aria-live="polite"></p></div><footer>Powered by FFmpeg · Converted files are saved through your browser</footer></main></div>
<script>
const token='__TOKEN__', fileInput=document.querySelector('#file'), drop=document.querySelector('#drop'), nameEl=document.querySelector('#filename'), hint=document.querySelector('#hint'), button=document.querySelector('#convert'), status=document.querySelector('#status'), format=document.querySelector('#format');let selected=null,busy=false;
function selectFile(file){if(!file||busy)return;selected=file;nameEl.textContent=file.name;hint.textContent=`${(file.size/1024/1024).toFixed(1)} MB · Click to change`;button.disabled=false;status.textContent='';status.className='status'}
drop.addEventListener('click',()=>{if(!busy)fileInput.click()});drop.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!busy){e.preventDefault();fileInput.click()}});fileInput.addEventListener('change',()=>selectFile(fileInput.files[0]));for(const event of ['dragenter','dragover'])drop.addEventListener(event,e=>{e.preventDefault();if(!busy)drop.classList.add('drag')});for(const event of ['dragleave','drop'])drop.addEventListener(event,e=>{e.preventDefault();drop.classList.remove('drag')});drop.addEventListener('drop',e=>selectFile(e.dataTransfer.files[0]));
button.addEventListener('click',async()=>{if(!selected||busy)return;busy=true;button.disabled=true;format.disabled=true;status.className='status';status.innerHTML='<span class="spin"></span>Converting locally. This may take a while…';try{const response=await fetch('/convert/'+format.value,{method:'POST',headers:{'X-FFmpegUI-Token':token,'Content-Type':'application/octet-stream'},body:selected});if(!response.ok)throw new Error(await response.text());const blob=await response.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(selected.name.replace(/\.[^.]+$/,'')||'converted')+'.'+format.value;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);status.textContent='Done! Your converted file is downloading.'}catch(error){status.className='status error';status.textContent='Could not convert this file. '+error.message}finally{busy=false;button.disabled=false;format.disabled=false}});
</script></body></html>
